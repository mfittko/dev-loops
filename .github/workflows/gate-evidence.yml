name: Gate evidence

# Behavioral contract (triggers, staleness, fail-closed provenance) is pinned by
# test/github/gate-evidence-workflow.test.mjs.
# Rationale and design records:
#   docs/decisions/0034-server-side-gate-evidence-required-check.md
#   docs/decisions/0043-gate-evidence-verdict-comment-refire.md
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  gate-evidence-runner:
    # pull_request/review events: skip drafts via the payload. issue_comment:
    # only PR comments carrying the gate-comment marker start a run (draft is
    # resolved by the Resolve-PR-facts step, since the payload has no PR object).
    if: >-
      (github.event_name != 'issue_comment' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '### Gate review:') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # One evaluation per PR at a time; a superseded in-flight run is cancelled —
    # the newer run reflects newer comment/thread state and posts the status.
    # JOB-level deliberately: a workflow-level group is joined by every run
    # BEFORE the job `if` is evaluated, so a marker-skipped ordinary-comment
    # run would cancel a live eligible evaluation and then post nothing —
    # re-creating the stale-status deadlock this workflow exists to close. A
    # job-level group is only joined by jobs that actually start.
    concurrency:
      group: gate-evidence-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # The one API call here is retried once; if it still fails, the run
      # fails with NO status posted — without a resolved head SHA there is
      # nothing to target. That window exists only on issue_comment runs and
      # leaves the prior status standing (identical to the pre-issue_comment
      # behavior); the next verdict post/edit re-fires a fresh evaluation.
      - name: Resolve PR facts (number, draft, head SHA)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            num="${{ github.event.issue.number }}"
            gh api "repos/${{ github.repository }}/pulls/${num}" > pr.json \
              || { sleep 5; gh api "repos/${{ github.repository }}/pulls/${num}" > pr.json; }
            {
              echo "number=${num}"
              echo "draft=$(jq -r '.draft' pr.json)"
              echo "head_sha=$(jq -r '.head.sha' pr.json)"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "number=${{ github.event.pull_request.number }}"
              echo "draft=${{ github.event.pull_request.draft }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
            } >> "$GITHUB_OUTPUT"
          fi

      # Default-branch ref: trusted evaluation code — see "Evaluation
      # provenance" in the header for the security rationale. Also removes the
      # per-event-type provenance variance (merge ref vs base vs default).
      # persist-credentials off: nothing after checkout needs git-embedded
      # credentials; the detector uses GH_TOKEN from env.
      - name: Check out repository
        if: steps.pr.outputs.draft == 'false'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        if: steps.pr.outputs.draft == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install workspace dependencies
        if: steps.pr.outputs.draft == 'false'
        run: npm ci

      # --skip-fanout-ledger-check: the fan-out findings-log ledger is a
      # gitignored, worktree-local tmp/ file that only the machine that ran the
      # review has on disk, so this stateless runner can never see it. This check
      # still enforces the part that IS remotely verifiable: a clean draft_gate
      # verdict, and a clean pre_approval_gate verdict on the current head,
      # including the documented light-mode inline exception.
      #
      # set +e: a non-zero exit must still reach the status-reporting step
      # below (posting a status) rather than aborting the job with no status
      # posted at all, which would leave the required check pending forever
      # instead of failing closed. stdout/stderr are captured to files (rather
      # than piped through `jq` directly) so a non-JSON line on either stream
      # can never break parsing, and both are still echoed for the same
      # Actions-log visibility a plain (uncaptured) run would have had.
      - name: Verify draft_gate / pre_approval_gate evidence
        id: gate_check
        if: steps.pr.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/github/detect-checkpoint-evidence.mjs \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr.outputs.number }}" \
            --skip-fanout-ledger-check \
            > gate_check_stdout.json 2> gate_check_stderr.json
          cat gate_check_stdout.json
          cat gate_check_stderr.json >&2

      # evidenceState (satisfied|not_established|violation, from
      # detect-checkpoint-evidence.mjs) drives the posted commit-status state.
      # #1702 makes the status ALWAYS DEFINITIVE — never `pending`, so a
      # completed run can never leave the required check dangling in a
      # stale-PENDING-BLOCKED state. The check only fires at a pre-merge/verdict
      # point, so `not_established` (no clean verdict for the current head yet)
      # is a fail-closed `failure` until the next verdict-post re-fires and
      # flips it to `success` — the merge gate stays decisive, never hung.
      # `violation` (a visible current-head comment carries a bad verdict, or
      # another pre-merge check failed) too. A missing/unparseable
      # evidenceState (e.g. an earlier checkout/npm-ci failure that skipped the
      # detector step entirely) fails CLOSED to `failure`, never "no status".
      # The loop's own CI-status reading excludes this context
      # (LOOP_DERIVED_CI_CHECK_NAME), so a definitive gate-evidence state never
      # deadlocks the loop's convergence.
      # !cancelled() (not always()): a run superseded via cancel-in-progress
      # has no evidenceState and must NOT post — always() would fire on
      # cancellation and race the newer run with a spurious `failure`. A
      # merely-failed detector step still posts (fail-closed) because
      # !cancelled() is true on step failure.
      - name: Report gate-evidence status on the PR head SHA
        if: ${{ !cancelled() && steps.pr.outputs.draft == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # set +e: nothing here may abort before the gh api POST below. Under
          # the Actions default shell (bash -eo pipefail) a non-zero jq/head in
          # the pipeline would otherwise exit the step with no status posted,
          # leaving the required check stuck (stale) instead of failing closed.
          set +e
          evidence_state="$(jq -r '.evidenceState // empty' gate_check_stdout.json gate_check_stderr.json 2>/dev/null | head -n1)"
          # #1702: definitive-only. `satisfied` is the only success; anything
          # else (not_established, violation, missing/parse error) fails closed
          # to `failure` so a completed run always leaves a pass/fail on the
          # current head, never a dangling stuck state.
          case "$evidence_state" in
            satisfied) state="success" ;;
            *) state="failure" ;;
          esac
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.head_sha }}" \
            -f "state=${state}" \
            -f "context=gate-evidence" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "description=draft_gate/pre_approval_gate evidence check"
