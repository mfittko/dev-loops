name: Gate evidence

# Behavioral contract (triggers, staleness, fail-closed provenance) is pinned by
# test/github/gate-evidence-workflow.test.mjs.
# Rationale and design records:
#   docs/decisions/0034-server-side-gate-evidence-required-check.md
#   docs/decisions/0043-gate-evidence-verdict-comment-refire.md
#   docs/decisions/0076-gate-evidence-reporter-split-always-settles-required-status.md
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  # Read-only: issue_comment runs download the head-declared-keys artifact
  # (fetch-head-declared-keys.mjs, default-branch code only).
  actions: read

jobs:
  # Trust boundary (docs/decisions/0034, 0076, 0234): PR head code runs ONLY in
  # this credential-less job (permissions: {}, no secrets; the only API use is the artifact upload via the runtime token, which head code can also reach, so the declared set is attacker-controlled). The
  # write-credential jobs below run ONLY default-branch code. This job's output
  # is a JSON list of config keys the PR head's own schema declares; the
  # detector treats it as DATA (env variable, never spliced into a shell) and
  # uses it only to tolerate a head-only config key the default-branch schema
  # does not know yet (docs/decisions/0234). The PR number comes from the event
  # payload and the head is fetched as refs/pull/<n>/head, so no token is
  # needed (a private repository would need `contents: read` here and would
  # fail closed to an empty key set). Every step is continue-on-error and the
  # output defaults to an empty key set, but a job-level failure or timeout is
  # still possible: the runner and reporter below tolerate it (empty set).
  #
  # Head code runs on pull_request* events ONLY. On issue_comment the workflow
  # runs in the default-branch context even for fork PRs, so running head
  # `bun install` / head config.mjs there would hold the default-branch Actions
  # runtime/cache token and could poison the default-branch cache. On
  # pull_request* GitHub isolates fork runs (read-only, merge-ref cache scope).
  # issue_comment runs instead download the declared keys this job uploads as an
  # artifact and treat them as data (scripts/github/fetch-head-declared-keys.mjs).
  head-declared-keys:
    if: github.event_name != 'issue_comment' && github.event.pull_request.draft == false
    timeout-minutes: 10
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      declared_keys: ${{ steps.report.outputs.declared_keys }}
    steps:
      - name: Check out PR head (untrusted)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          path: head
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false

      # Trusted script source only; it is never given PR head scripts.
      - name: Check out default branch (trusted script)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          path: trusted
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install PR head dependencies (no credentials, no secrets)
        continue-on-error: true
        working-directory: head
        run: bun install --frozen-lockfile

      - name: Report keys the PR head schema declares
        id: report
        continue-on-error: true
        run: |
          keys='{"declaredKeys":[]}'
          out="$(node trusted/scripts/github/report-head-declared-keys.mjs --head-root head 2>/dev/null | head -n1 | head -c 65536)" && [ -n "$out" ] && keys="$out"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "declared_keys<<${delim}"
            echo "$keys"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$keys" > "$RUNNER_TEMP/keys/head-declared-keys.json"

      - name: Upload declared keys for issue_comment runs (data only)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: head-declared-keys-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/keys/head-declared-keys.json
          overwrite: true
          retention-days: 7
          if-no-files-found: ignore

  # The compute-heavy DETECTOR: checks out the trusted default branch and runs
  # detect-checkpoint-evidence.mjs. Keeps job-level cancel-in-progress — its
  # waste-avoidance is worth keeping — but it no longer owns the required
  # `gate-evidence` status (see docs/decisions/0076). It exposes its verdict as
  # a job output so the non-cancelling reporter job below can reuse it without
  # recomputing when it was not superseded.
  gate-evidence-runner:
    needs: [head-declared-keys]
    # pull_request/review events: skip drafts via the payload. issue_comment:
    # only PR comments carrying the gate-comment marker, the carried-heads record marker OR the head-pinned
    # approve-merge marker start a run (draft is resolved by the
    # Resolve-PR-facts step, since the payload has no PR object). An
    # approve-merge marker starting a run also covers its RETRACTION: an
    # edit-away (new body no longer matches, but `changes.body.from` still
    # carries the prior marker body) and a deletion (the `deleted` action,
    # where `comment.body` still carries the deleted body) both re-fire so a
    # retracted approval re-evaluates the head instead of leaving a stale
    # status — fail-closed.
    #
    # !cancelled(): a skipped (issue_comment) or failed/timed-out
    # head-declared-keys job must NOT skip this runner, or a stale success
    # would stand after an approve-merge retraction. An empty keys output
    # parses to the empty set (fail closed).
    if: >-
      ${{ !cancelled() && (
      (github.event_name != 'issue_comment' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '### Gate review:') ||
        startsWith(github.event.comment.body, 'approve merge ') ||
        startsWith(github.event.comment.body, '<!-- dev-loops:carried-heads:v1') ||
        startsWith(github.event.changes.body.from, 'approve merge ')) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))) }}
    # One evaluation per PR at a time; a superseded in-flight run is cancelled —
    # the newer run reflects newer comment/thread state. JOB-level
    # deliberately: a workflow-level group is joined by every run BEFORE the
    # job `if` is evaluated, so a marker-skipped ordinary-comment run would
    # cancel a live eligible evaluation. A job-level group is only joined by
    # jobs that actually start. A cancelled detector run contributes no
    # evidence_state output; the reporter job recomputes in that case (0076) —
    # this job no longer needs to itself guarantee a completed, status-posting
    # run at the final head.
    concurrency:
      group: gate-evidence-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      evidence_state: ${{ steps.gate_check.outputs.evidence_state }}
      number: ${{ steps.pr.outputs.number }}
      draft: ${{ steps.pr.outputs.draft }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      evaluated_head_sha: ${{ steps.gate_check.outputs.evaluated_head_sha }}
    steps:
      # The one API call here is retried once; if it still fails, the run
      # fails with no evidence_state output — the reporter job recomputes.
      # That window exists only on issue_comment runs and leaves the prior
      # status standing until the reporter's independent resolution below.
      - name: Resolve PR facts (number, draft, head SHA)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            num="${{ github.event.issue.number }}"
            gh api "repos/${{ github.repository }}/pulls/${num}" > pr.json \
              || { sleep 5; gh api "repos/${{ github.repository }}/pulls/${num}" > pr.json; }
            {
              echo "number=${num}"
              echo "draft=$(jq -r '.draft' pr.json)"
              echo "head_sha=$(jq -r '.head.sha' pr.json)"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "number=${{ github.event.pull_request.number }}"
              echo "draft=${{ github.event.pull_request.draft }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
            } >> "$GITHUB_OUTPUT"
          fi

      # Default-branch ref: trusted evaluation code — see "Evaluation
      # provenance" in the header for the security rationale. Also removes the
      # per-event-type provenance variance (merge ref vs base vs default).
      # persist-credentials off: nothing after checkout needs git-embedded
      # credentials; the detector uses GH_TOKEN from env.
      - name: Check out repository
        if: steps.pr.outputs.draft == 'false'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        if: steps.pr.outputs.draft == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        if: steps.pr.outputs.draft == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install workspace dependencies
        if: steps.pr.outputs.draft == 'false'
        run: bun install --frozen-lockfile

      # issue_comment runs never execute PR head code: they read the keys the
      # pull_request run uploaded, via default-branch code only. A failure
      # leaves the output unset, which parses to the empty set (fail closed).
      - name: Fetch head-declared keys artifact (data only)
        id: fetch_keys
        if: github.event_name == 'issue_comment' && steps.pr.outputs.draft == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keys="$(node scripts/github/fetch-head-declared-keys.mjs --repo "${{ github.repository }}" --pr "${{ steps.pr.outputs.number }}" --head-sha "${{ steps.pr.outputs.head_sha }}" | head -n1 | head -c 65536)"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "declared_keys<<${delim}"
            echo "$keys"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # --skip-fanout-ledger-check: the fan-out findings-log ledger is a
      # gitignored, worktree-local tmp/ file that only the machine that ran the
      # review has on disk, so this stateless runner can never see it. This check
      # still enforces the part that IS remotely verifiable: a clean draft_gate
      # verdict, and a clean pre_approval_gate verdict on the current head,
      # including the documented light-mode inline exception.
      #
      # set +e: a non-zero exit must still reach the evidence_state output write
      # below rather than aborting the job with no output written at all, which
      # would silently force the reporter job into a recompute it could avoid.
      # stdout/stderr are captured to files (rather than piped through `jq`
      # directly) so a non-JSON line on either stream can never break parsing,
      # and both are still echoed for the same Actions-log visibility a plain
      # (uncaptured) run would have had. This job no longer POSTS a status
      # (0076) — it only computes and exposes evidenceState as a job output;
      # the reporter job below owns the required `gate-evidence` status.
      #
      # evaluated_head_sha (detect-checkpoint-evidence.mjs's OWN currentHeadSha,
      # not steps.pr.outputs.head_sha) is also exposed: the reporter's reuse
      # path posts evidence_state, so it must post it to the EXACT head this
      # detection ran against, not a separately-resolved head that could have
      # advanced between the two resolutions.
      - name: Verify draft_gate / pre_approval_gate evidence
        id: gate_check
        if: steps.pr.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_DECLARED_KEYS: ${{ github.event_name == 'issue_comment' && steps.fetch_keys.outputs.declared_keys || needs.head-declared-keys.outputs.declared_keys }}
        run: |
          set +e
          node scripts/github/detect-checkpoint-evidence.mjs \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr.outputs.number }}" \
            --head-declared-keys="$HEAD_DECLARED_KEYS" \
            --skip-fanout-ledger-check \
            > gate_check_stdout.json 2> gate_check_stderr.json
          cat gate_check_stdout.json
          cat gate_check_stderr.json >&2
          evidence_state="$(jq -r '.evidenceState // empty' gate_check_stdout.json gate_check_stderr.json 2>/dev/null | head -n1)"
          echo "evidence_state=${evidence_state}" >> "$GITHUB_OUTPUT"
          evaluated_head_sha="$(jq -r '.currentHeadSha // empty' gate_check_stdout.json gate_check_stderr.json 2>/dev/null | head -n1)"
          echo "evaluated_head_sha=${evaluated_head_sha}" >> "$GITHUB_OUTPUT"

  # The always-settling REPORTER: owns the required `gate-evidence` status.
  # Concurrency-exempt from the detector's cancel-in-progress group (its own
  # NON-cancelling group), so a burst of review/comment events can cancel
  # every detector run — including the last-triggered one — without leaving
  # the required check dangling: this job still runs for the final event and
  # always posts a definitive state at the resolved head (docs/decisions/0076).
  gate-evidence-reporter:
    needs: [gate-evidence-runner, head-declared-keys]
    # always(): runs whether the detector succeeded, failed, or was cancelled
    # by its OWN job-level concurrency group (the workflow RUN itself is not
    # cancelled, only that one job) — `needs.<job>.result` reports `cancelled`
    # in that case, not `skipped`, so `always()` still lets this job start.
    # `!= 'skipped'` preserves the draft / non-marker-comment no-op: the
    # detector's job `if` guard skips it outright for those events, and this
    # job must skip too rather than posting a status for an event that was
    # never eligible.
    if: ${{ always() && needs.gate-evidence-runner.result != 'skipped' }}
    # NON-cancelling: serializes per PR (a run still QUEUED when a newer one
    # is queued is superseded and dropped without executing — it would only
    # have posted a state a newer event already supersedes), but NEVER kills a
    # RUNNING reporter. The run triggered by the final event in a burst is
    # therefore always the one that gets to execute and post — the design
    # invariant that closes the issue (see the burst-simulation regression in
    # test/github/gate-evidence-burst.test.mjs).
    concurrency:
      group: gate-evidence-reporter-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Copied verbatim from the detector's Resolve-PR-facts step: this job
      # resolves number/draft/head SHA INDEPENDENTLY, so it is robust to the
      # detector job having been cancelled before it ever set its own outputs.
      - name: Resolve PR facts (number, draft, head SHA)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            num="${{ github.event.issue.number }}"
            gh api "repos/${{ github.repository }}/pulls/${num}" > pr.json \
              || { sleep 5; gh api "repos/${{ github.repository }}/pulls/${num}" > pr.json; }
            {
              echo "number=${num}"
              echo "draft=$(jq -r '.draft' pr.json)"
              echo "head_sha=$(jq -r '.head.sha' pr.json)"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "number=${{ github.event.pull_request.number }}"
              echo "draft=${{ github.event.pull_request.draft }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
            } >> "$GITHUB_OUTPUT"
          fi

      # Reuse the detector's evidence_state when it is present (the detector
      # was not superseded before it wrote it). When it is EMPTY — the
      # detector was cancelled or failed before reaching that write — this job
      # recomputes independently below, rather than posting on stale/missing
      # information.
      #
      # EVIDENCE_STATE is routed through env (not spliced as `${{ }}` directly
      # into the shell) — a `${{ }}`-into-shell splice is the GitHub Actions
      # script-injection anti-pattern.
      - name: Decide evidence source
        id: decide
        if: steps.pr.outputs.draft == 'false'
        env:
          EVIDENCE_STATE: ${{ needs.gate-evidence-runner.outputs.evidence_state }}
        run: |
          evidence_state="$EVIDENCE_STATE"
          if [ -n "$evidence_state" ]; then
            {
              echo "evidence_state=${evidence_state}"
              echo "recompute=false"
            } >> "$GITHUB_OUTPUT"
          else
            echo "recompute=true" >> "$GITHUB_OUTPUT"
          fi

      # The recompute path mirrors the detector's checkout/setup/install/detect
      # steps exactly (same trusted-base evaluation provenance) — it only runs
      # when the detector's own evidence_state was unavailable.
      - name: Check out repository
        if: steps.decide.outputs.recompute == 'true' && steps.pr.outputs.draft == 'false'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        if: steps.decide.outputs.recompute == 'true' && steps.pr.outputs.draft == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        if: steps.decide.outputs.recompute == 'true' && steps.pr.outputs.draft == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install workspace dependencies
        if: steps.decide.outputs.recompute == 'true' && steps.pr.outputs.draft == 'false'
        run: bun install --frozen-lockfile

      - name: Fetch head-declared keys artifact (data only)
        id: fetch_keys
        if: github.event_name == 'issue_comment' && steps.decide.outputs.recompute == 'true' && steps.pr.outputs.draft == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keys="$(node scripts/github/fetch-head-declared-keys.mjs --repo "${{ github.repository }}" --pr "${{ steps.pr.outputs.number }}" --head-sha "${{ steps.pr.outputs.head_sha }}" | head -n1 | head -c 65536)"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "declared_keys<<${delim}"
            echo "$keys"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Recompute draft_gate / pre_approval_gate evidence
        id: recompute_check
        if: steps.decide.outputs.recompute == 'true' && steps.pr.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_DECLARED_KEYS: ${{ github.event_name == 'issue_comment' && steps.fetch_keys.outputs.declared_keys || needs.head-declared-keys.outputs.declared_keys }}
        run: |
          set +e
          node scripts/github/detect-checkpoint-evidence.mjs \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr.outputs.number }}" \
            --head-declared-keys="$HEAD_DECLARED_KEYS" \
            --skip-fanout-ledger-check \
            > gate_check_stdout.json 2> gate_check_stderr.json
          cat gate_check_stdout.json
          cat gate_check_stderr.json >&2
          evidence_state="$(jq -r '.evidenceState // empty' gate_check_stdout.json gate_check_stderr.json 2>/dev/null | head -n1)"
          echo "evidence_state=${evidence_state}" >> "$GITHUB_OUTPUT"
          evaluated_head_sha="$(jq -r '.currentHeadSha // empty' gate_check_stdout.json gate_check_stderr.json 2>/dev/null | head -n1)"
          echo "evaluated_head_sha=${evaluated_head_sha}" >> "$GITHUB_OUTPUT"

      # evidenceState (satisfied|not_established|violation, from
      # detect-checkpoint-evidence.mjs) drives the posted commit-status state.
      # #1702 makes the status ALWAYS DEFINITIVE — never `pending`, so a
      # completed run can never leave the required check dangling in a
      # stale-PENDING-BLOCKED state. `not_established`/`violation`/a missing or
      # unparseable evidenceState all fail CLOSED to `failure`; only
      # `satisfied` maps to `success`. This job is NON-cancelling
      # (docs/decisions/0076), so — unlike the old single-job design — there is
      # no `!cancelled()` guard here.
      #
      # if: always() — a JOB running to completion does not mean every STEP in
      # it runs. Without always() here, this step's default success()
      # condition would SKIP it whenever an earlier reporter step in this same
      # job fails (Resolve PR facts, checkout/setup-node/setup-bun/install, or
      # Recompute draft_gate/pre_approval_gate evidence) — reintroducing the
      # dangling required-status deadlock this reporter split exists to close
      # (docs/decisions/0076). always() lets this step run on any upstream
      # outcome, gated only by the resolved draft flag; a failed recompute
      # leaves evidence_state/evaluated_head_sha empty, which the mapping and
      # fallback below already resolve to a fail-closed `failure` posted to
      # the reporter's own resolved head. The one case this deliberately does
      # NOT cover is Resolve PR facts itself failing before setting `draft` —
      # that leaves the guard false and nothing posted, the pre-existing
      # accepted residual documented in docs/decisions/0043 and 0076.
      #
      # Head-pairing: the REUSE path (recompute == false) posts evidence_state
      # computed by the detector's OWN detect-checkpoint-evidence.mjs run, so
      # it MUST target the EXACT head that run evaluated — its own
      # `currentHeadSha`, exposed as
      # `needs.gate-evidence-runner.outputs.evaluated_head_sha` — never
      # `head_sha` from the detector's separately-resolved Resolve-PR-facts
      # step. Pairing evidence_state with a head resolved by a separate API
      # call (as the old wiring did) lets a push land between the two
      # resolutions and post a verdict for head X onto head Y. Likewise the
      # RECOMPUTE path posts `steps.recompute_check.outputs.evaluated_head_sha`
      # — the head this job's own detection run evaluated — not its
      # independently-resolved `steps.pr.outputs.head_sha`. If the selected
      # evaluated head is EMPTY (detection could not resolve a head at all —
      # evidence_state is then empty too, which already fails closed to
      # `failure`), fall back to this job's own resolved
      # `steps.pr.outputs.head_sha` so a fail-closed `failure` still lands
      # somewhere rather than the status post being skipped outright. Every
      # `${{ }}` value read below — both evaluated head SHAs, the reporter's
      # own head, and both evidence_state values — is routed through env, not
      # spliced directly into the shell (script-injection anti-pattern).
      - name: Report gate-evidence status on the PR head SHA
        id: post
        if: ${{ always() && steps.pr.outputs.draft == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOMPUTE: ${{ steps.decide.outputs.recompute }}
          REUSED_EVIDENCE_STATE: ${{ steps.decide.outputs.evidence_state }}
          RECOMPUTED_EVIDENCE_STATE: ${{ steps.recompute_check.outputs.evidence_state }}
          DETECTOR_EVALUATED_HEAD_SHA: ${{ needs.gate-evidence-runner.outputs.evaluated_head_sha }}
          RECOMPUTE_EVALUATED_HEAD_SHA: ${{ steps.recompute_check.outputs.evaluated_head_sha }}
          REPORTER_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set +e
          if [ "$RECOMPUTE" = "true" ]; then
            evidence_state="$RECOMPUTED_EVIDENCE_STATE"
            evaluated_head_sha="$RECOMPUTE_EVALUATED_HEAD_SHA"
          else
            evidence_state="$REUSED_EVIDENCE_STATE"
            evaluated_head_sha="$DETECTOR_EVALUATED_HEAD_SHA"
          fi
          if [ -n "$evaluated_head_sha" ]; then
            head_sha="$evaluated_head_sha"
          else
            head_sha="$REPORTER_HEAD_SHA"
          fi
          case "$evidence_state" in
            satisfied) state="success" ;;
            *) state="failure" ;;
          esac
          gh api --method POST "repos/${{ github.repository }}/statuses/${head_sha}" \
            -f "state=${state}" \
            -f "context=gate-evidence" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "description=draft_gate/pre_approval_gate evidence check"
