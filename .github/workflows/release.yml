name: Create GitHub Release

# Tagging is the only manual release step for prereleases; a stable release
# also requires the operator "approve release v<version>" comment first (see
# "Operator release approval gate" in skills/docs/release-runbook.md). Pushing
# a "v*" tag creates the GitHub Release, then dispatches npm-publish.yml
# explicitly: releases
# created with GITHUB_TOKEN never fire `on: release`, so event chaining
# alone silently skips npm publishing (#1187). workflow_dispatch is the
# documented GITHUB_TOKEN exception.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      # #1901: the approval gate reads issue search + issue comments via
      # GITHUB_TOKEN; explicit permissions default missing scopes to none.
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag commit $(git rev-parse HEAD) is not an ancestor of origin/main. Releasing is only allowed from the main branch."
            exit 1
          fi

      # Root cause of #1033 (+ #1886 prerelease drift): fail the release if the
      # root `dev-loops` manifest's `@dev-loops/core` dependency (full version,
      # including the prerelease token) or the committed `package-lock.json`
      # version fields are out of lockstep with the version being released
      # (e.g. dev-loops@0.6.2 carrying @dev-loops/core@^0.2.6; rc.7 shipping a
      # lockfile still pinned to rc.6). node-builtins-only, so it runs without
      # `npm ci`.
      - name: Assert manifest and lockfile are in lockstep with the release
        run: |
          node scripts/release/assert-core-dependency-version.mjs \
            --release-version "${{ steps.version.outputs.version }}"

      # #1901: cutting a STABLE tag is a gated release decision, not an agent
      # judgment call. The check fails closed (no Release, no npm-publish
      # dispatch) unless an explicit per-release operator approval record
      # exists (an issue comment by the repo owner stating
      # "approve release v<version>"); blanket merge authorizations and
      # generic continue instructions never satisfy it. Prereleases pass
      # through unchanged (the gate applies to stable releases only).
      - name: Assert operator release approval (stable releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/verify-release-approval.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}"

      - name: Skip if release already exists (idempotent)
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::notice::Release ${{ steps.version.outputs.tag }} already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md (fail closed)
        if: steps.exists.outputs.exists == 'false'
        run: |
          node scripts/release/extract-changelog-section.mjs \
            --version "${{ steps.version.outputs.version }}" \
            > release-notes.md

      - name: Create GitHub Release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single source of truth for prerelease detection: reuse the npm
          # dist-tag resolver (it strips SemVer build metadata, validates the
          # version, and fails closed on a garbled tag). A `latest` dist-tag means
          # a stable release (--latest); anything else is a prerelease channel
          # (--prerelease) so the RC never becomes the default download. This
          # keeps the GitHub-Release flag and the npm dist-tag from ever drifting.
          DIST_TAG=$(node scripts/release/resolve-npm-dist-tag.mjs --version "${{ steps.version.outputs.version }}")
          if [ "${DIST_TAG}" = "latest" ]; then
            RELEASE_FLAG=--latest
          else
            RELEASE_FLAG=--prerelease
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            "${RELEASE_FLAG}" \
            --verify-tag

      # Not gated on `exists`: re-running after a failed dispatch/publish must
      # retry. npm-publish.yml itself skips versions already on the registry.
      - name: Dispatch npm publish for the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run npm-publish.yml --ref "${{ steps.version.outputs.tag }}"
