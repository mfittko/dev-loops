name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  BUN_TEST_PARALLELISM: 2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      inspect_run_viewer: ${{ steps.inspect-run-viewer-scope.outputs.inspect_run_viewer }}
      presentations: ${{ steps.rendered-artifact-scope.outputs.presentations }}
      articles: ${{ steps.rendered-artifact-scope.outputs.articles }}
      timing_input: ${{ steps.timings.outputs.timing_input }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Select one trusted timing snapshot for every shard
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-test-timings.mjs prepare

      - name: Determine whether inspect-run viewer smoke is required
        id: inspect-run-viewer-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'inspect_run_viewer=true' >> "$GITHUB_OUTPUT"
            echo "No usable diff base detected; forcing inspect-run viewer smoke."
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .inspect-run-viewer-changed-files.txt
          GITHUB_OUTPUT="$GITHUB_OUTPUT" node scripts/loop/inspect-run-viewer-ci-changes.mjs .inspect-run-viewer-changed-files.txt

      # Deck/article fit smoke triggers (issue #976): a change to a rendered HTML
      # artifact must run its fit/render smoke so the UI-e2e gate has a satisfiable
      # CI signal. No usable diff base → force both (fail-safe).
      - name: Determine whether deck/article smoke is required
        id: rendered-artifact-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'presentations=true' >> "$GITHUB_OUTPUT"
            echo 'articles=true' >> "$GITHUB_OUTPUT"
            echo "No usable diff base detected; forcing deck and article smoke."
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .rendered-artifact-changed-files.txt
          GITHUB_OUTPUT="$GITHUB_OUTPUT" node scripts/loop/rendered-artifact-ci-changes.mjs .rendered-artifact-changed-files.txt

  verify-suite:
    needs: changes
    name: verify-suite (${{ matrix.suite }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    env:
      BUN_TEST_PARALLELISM: 2
      TIMING_INPUT: ${{ needs.changes.outputs.timing_input }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test:docs
          - test:workflows
        include:
          # Docs need the decision-record merge base; test shards need the
          # historical producer fixture regardless of its current shard assignment.
          - suite: test:docs
            fetch_depth: 0
          - suite: test:all
            shard: 1/4
            shard_index: 1
            fetch_depth: 0
          - suite: test:all
            shard: 2/4
            shard_index: 2
            fetch_depth: 0
          - suite: test:all
            shard: 3/4
            shard_index: 3
            fetch_depth: 0
          - suite: test:all
            shard: 4/4
            shard_index: 4
            fetch_depth: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.fetch_depth }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # Pinned version + sha256 must match scripts/github/lint-workflows.mjs's
      # ACTIONLINT_VERSION / ACTIONLINT_LINUX_AMD64_SHA256 (a test asserts it).
      # Downloads the release archive directly and verifies its checksum before
      # extracting — a supply-chain trust boundary, not just a version pin.
      # Only this matrix leg needs the binary; putting it on PATH via
      # GITHUB_PATH lets test:workflows find the plain `actionlint` command
      # exactly like a local install would.
      - name: Install actionlint
        if: matrix.suite == 'test:workflows'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The decision-record validator's rule 3 resolves the base via
      # `git merge-base origin/<default> HEAD`. actions/checkout with fetch-depth: 0
      # for a pull_request checks out the PR merge ref but does NOT fetch
      # remote-tracking refs like origin/main, so without this the guard silently
      # degrades to skipped instead of enforcing in PR CI.
      - name: Fetch base branch (decision-record merge-base)
        if: matrix.suite == 'test:docs'
        run: |
          git fetch origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Run ${{ matrix.suite }}
        if: matrix.shard == ''
        env:
          DEVLOOPS_PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run ${{ matrix.suite }}

      - name: Materialize identical timing input and reserve fresh output
        if: matrix.shard != ''
        run: bun scripts/ci-test-timings.mjs input

      - name: Run ${{ matrix.suite }} shard ${{ matrix.shard }}
        if: matrix.shard != ''
        env:
          DEVLOOPS_PR_TITLE: ${{ github.event.pull_request.title }}
          BUN_TEST_TIMINGS_PATH: .ci-timing-input.json
        run: bun run ${{ matrix.suite }} --timings=.ci-timing-output.json --timings=.ci-timing-input.json --update-timings --shard=${{ matrix.shard }}

      - name: Upload PR timing diagnostics
        if: matrix.shard != '' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard_index }}
          path: |
            .ci-timing-output.json
            .ci-timing-input.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Bind successful shard measurements to this run
        id: collect-timings
        continue-on-error: true
        if: matrix.shard != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING_SHARD: ${{ matrix.shard_index }}
        run: bun scripts/ci-test-timings.mjs collect

      - name: Upload successful shard measurements
        if: steps.collect-timings.outcome == 'success' && matrix.shard != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: shard.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [changes, verify-suite, viewer-smoke, deck-smoke, article-smoke]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require all verify-suite legs to pass
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.verify-suite.result }}" = "success" ] || exit 1
          [ "${{ needs.viewer-smoke.result }}" = "success" ] || [ "${{ needs.viewer-smoke.result }}" = "skipped" ] || exit 1
          [ "${{ needs.deck-smoke.result }}" = "success" ] || [ "${{ needs.deck-smoke.result }}" = "skipped" ] || exit 1
          [ "${{ needs.article-smoke.result }}" = "success" ] || [ "${{ needs.article-smoke.result }}" = "skipped" ] || exit 1

  publish-timings:
    needs: [changes, verify]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TIMING_INPUT: ${{ needs.changes.outputs.timing_input }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-timing-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: timing-shards
      - name: Validate complete same-run measurements
        run: bun scripts/ci-test-timings.mjs merge
      - uses: actions/upload-artifact@v4
        with:
          name: ci-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: profile.json
          if-no-files-found: error
          retention-days: 30

  viewer-smoke:
    needs:
      - changes
    if: needs.changes.outputs.inspect_run_viewer == 'true'
    # Playwright 1.60.0 has no WebKit build for ubuntu-26.04 (what ubuntu-latest now resolves to).
    # Revisit when Playwright supports WebKit on Ubuntu 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Playwright WebKit
        uses: ./.github/actions/playwright-webkit

      - name: Run inspect-run viewer WebKit smoke
        run: bun run test:playwright:viewer

  deck-smoke:
    needs:
      - changes
    if: needs.changes.outputs.presentations == 'true'
    # Playwright 1.60.0 has no WebKit build for ubuntu-26.04 (what ubuntu-latest now resolves to).
    # Revisit when Playwright supports WebKit on Ubuntu 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Playwright WebKit
        uses: ./.github/actions/playwright-webkit

      - name: Run presentation deck fit smoke (WebKit)
        run: |
          bun run test:playwright:intro-deck
          bun run test:playwright:deep-dive
          bun run test:playwright:how-decided-deck
          bun run test:playwright:state-graph-surface-deck
          bun run test:playwright:finding-the-flow-deck

  article-smoke:
    needs:
      - changes
    if: needs.changes.outputs.articles == 'true'
    # Playwright 1.60.0 has no WebKit build for ubuntu-26.04 (what ubuntu-latest now resolves to).
    # Revisit when Playwright supports WebKit on Ubuntu 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Playwright WebKit
        uses: ./.github/actions/playwright-webkit

      - name: Run article fit smoke (WebKit)
        run: |
          bun run test:playwright:intro-article
          bun run test:playwright:deep-dive-article
          bun run test:playwright:how-decided-article
          bun run test:playwright:simulator-article
          bun run test:playwright:simulator-overview-article
