name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      inspect_run_viewer: ${{ steps.inspect-run-viewer-scope.outputs.inspect_run_viewer }}
      presentations: ${{ steps.rendered-artifact-scope.outputs.presentations }}
      articles: ${{ steps.rendered-artifact-scope.outputs.articles }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      - name: Determine whether inspect-run viewer smoke is required
        id: inspect-run-viewer-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'inspect_run_viewer=true' >> "$GITHUB_OUTPUT"
            echo "No usable diff base detected; forcing inspect-run viewer smoke."
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .inspect-run-viewer-changed-files.txt
          GITHUB_OUTPUT="$GITHUB_OUTPUT" node scripts/loop/inspect-run-viewer-ci-changes.mjs .inspect-run-viewer-changed-files.txt

      # Deck/article fit smoke triggers (issue #976): a change to a rendered HTML
      # artifact must run its fit/CSP smoke so the UI-e2e gate has a satisfiable
      # CI signal. No usable diff base → force both (fail-safe).
      - name: Determine whether deck/article smoke is required
        id: rendered-artifact-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'presentations=true' >> "$GITHUB_OUTPUT"
            echo 'articles=true' >> "$GITHUB_OUTPUT"
            echo "No usable diff base detected; forcing deck and article smoke."
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          # Triggers include the harness/specs/configs that drive the smoke so a
          # change to the assertions themselves re-runs the affected family.
          if echo "$CHANGED" | grep -Eq '^docs/presentations/.*\.html$|^test/playwright/(harness/deck-fit-harness|harness/webkit-smoke-harness|intro-deck\.spec|deep-dive-deck\.spec)\.mjs$|^playwright\.config\.mjs$'; then
            echo 'presentations=true' >> "$GITHUB_OUTPUT"
          else
            echo 'presentations=false' >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -Eq '^docs/articles/.*\.html$|^test/playwright/(harness/deck-fit-harness|harness/webkit-smoke-harness|intro-article\.spec|deep-dive-article\.spec)\.mjs$|^playwright\.config\.mjs$'; then
            echo 'articles=true' >> "$GITHUB_OUTPUT"
          else
            echo 'articles=false' >> "$GITHUB_OUTPUT"
          fi

  verify-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: test:assets
          - suite: test:extension
          - suite: test:scripts
          - suite: test:core
          # Only the test:docs leg needs full history for the decision-record
          # merge-base comparison; every other leg checks out the default (depth 1).
          - suite: test:docs
            fetch-depth: 0
          - suite: test:pack
          - suite: test:dev-loop
          - suite: test:workflows

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      # Pinned version + sha256 must match scripts/github/lint-workflows.mjs's
      # ACTIONLINT_VERSION / ACTIONLINT_LINUX_AMD64_SHA256 (a test asserts it).
      # Downloads the release archive directly and verifies its checksum before
      # extracting — a supply-chain trust boundary, not just a version pin.
      # Only this matrix leg needs the binary; putting it on PATH via
      # GITHUB_PATH lets test:workflows find the plain `actionlint` command
      # exactly like a local install would.
      - name: Install actionlint
        if: matrix.suite == 'test:workflows'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The decision-record validator's rule 3 resolves the base via
      # `git merge-base origin/<default> HEAD`. actions/checkout with fetch-depth: 0
      # for a pull_request checks out the PR merge ref but does NOT fetch
      # remote-tracking refs like origin/main, so without this the guard silently
      # degrades to skipped instead of enforcing in PR CI.
      - name: Fetch base branch (decision-record merge-base)
        if: matrix.suite == 'test:docs'
        run: |
          git fetch origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Run ${{ matrix.suite }}
        run: npm run ${{ matrix.suite }}

  verify:
    needs: [verify-suite]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require all verify-suite legs to pass
        run: '[ "${{ needs.verify-suite.result }}" = "success" ] || exit 1'

  viewer-smoke:
    needs:
      - changes
    if: needs.changes.outputs.inspect_run_viewer == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Playwright WebKit
        uses: ./.github/actions/playwright-webkit

      - name: Run inspect-run viewer WebKit smoke
        run: npm run test:playwright:viewer

  deck-smoke:
    needs:
      - changes
    if: needs.changes.outputs.presentations == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Playwright WebKit
        uses: ./.github/actions/playwright-webkit

      - name: Run presentation deck fit smoke (WebKit)
        run: |
          npm run test:playwright:intro-deck
          npm run test:playwright:deep-dive
          npm run test:playwright:how-decided-deck

  article-smoke:
    needs:
      - changes
    if: needs.changes.outputs.articles == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Playwright WebKit
        uses: ./.github/actions/playwright-webkit

      - name: Run article fit smoke (WebKit)
        run: |
          npm run test:playwright:intro-article
          npm run test:playwright:deep-dive-article
          npm run test:playwright:how-decided-article
